<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="Crispyroll - Unofficial Linux HTPC Client for Crunchyroll" />
    <meta name="author" content="khSafvan" />
    <title>Crispyroll</title>

    <!-- Platform & Key Handlers -->
    <script src="src/renderer/keys.js"></script>
    <script src="src/renderer/app.js"></script>

    <!-- Core Styles -->
    <link rel="stylesheet" href="src/renderer/styles/variables.css" />
    <link rel="stylesheet" href="src/renderer/styles/base.css" />

    <!-- Vendor Styles -->
    <link rel="stylesheet" href="src/renderer/styles/vendor/bulma.min.css" />
    <link rel="stylesheet" href="src/renderer/styles/bulma-theme.css" />
    <link rel="stylesheet" href="src/renderer/styles/vendor/font-awesome.min.css" />
    <link rel="stylesheet" href="src/renderer/styles/vendor/slick.css" />

    <!-- Component Styles -->
    <link rel="stylesheet" href="src/renderer/styles/components/loading.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/exit.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/login.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/mylist.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/search.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/history.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/browse.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/profiles.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/changelog.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/home.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/video.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/keyboard.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/menu.css" />
    <link rel="stylesheet" href="src/renderer/styles/components/settings.css" />
  </head>

  <body onkeydown="app.keyDown(event)">
    <!-- Fallback Connection Error Screen -->
    <div id="error-screen">
      <div class="content">
        <div class="logo">
          <img src="assets/images/logo.png" alt="Crunchyroll" />
        </div>
        <div class="details">
          <div class="code">404</div>
          <div class="text">Error connecting to server.</div>
        </div>
      </div>
    </div>

    <!-- Vendor Libraries -->
    <script src="src/renderer/vendor/dash.min.js"></script>
    <script src="src/renderer/vendor/jquery.min.js"></script>
    <script src="src/renderer/vendor/slick.min.js"></script>

    <!-- Core Helpers, Bundled Modules & Services -->
    <script src="src/renderer/utils/sanitizeTitle.js"></script>
    <script src="src/renderer/bundle.js"></script>
    <script src="src/renderer/core/icons.js"></script>
    <script src="src/renderer/core/mappers/crunchyroll.js"></script>
    <script src="src/renderer/core/languages.js"></script>
    <script src="src/renderer/core/session.js"></script>
    <script src="src/renderer/core/tracker.js"></script>
    <script src="src/renderer/core/discovery.js"></script>
    <script src="src/renderer/core/player.js"></script>
    <script src="src/renderer/core/service.js"></script>
    <script src="src/renderer/core/api.js"></script>

    <!-- Screen Modules -->
    <script src="src/renderer/screens/loading.js"></script>
    <script src="src/renderer/screens/exit.js"></script>
    <script src="src/renderer/screens/login.js"></script>
    <script src="src/renderer/screens/mylist.js"></script>
    <script src="src/renderer/screens/search.js"></script>
    <script src="src/renderer/screens/history.js"></script>
    <script src="src/renderer/screens/browse.js"></script>
    <script src="src/renderer/screens/profiles.js"></script>
    <script src="src/renderer/screens/changelog.js"></script>
    <script src="src/renderer/screens/home.js"></script>
    <script src="src/renderer/screens/home-details.js"></script>
    <script src="src/renderer/screens/home-episodes.js"></script>
    <script src="src/renderer/screens/video.js"></script>
    <script src="src/renderer/screens/keyboard.js"></script>
    <script src="src/renderer/screens/menu.js"></script>
    <script src="src/renderer/screens/settings.js"></script>

    <!-- Main Orchestrator & Controllers -->
    <script src="src/renderer/main.js"></script>
    <script src="src/renderer/electron/controller-listener.js"></script>
  </body>
</html>
